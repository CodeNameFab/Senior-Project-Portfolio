<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif&display=swap">
<style>
:root{--paper:#f2f3f0;--ink:#15171b;--muted:#6c7079;--accent:#8a5a12;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#101114;--ink:#e9e9e5;--muted:#868b94;--accent:#d9a441;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
     font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;
     padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.box{max-width:30rem}
.code{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(2.2rem,7vw,3.4rem);line-height:1.05;margin:0 0 1rem}
p{color:var(--muted);font-size:.9rem;line-height:1.6;margin:0 0 1.75rem}
a{display:inline-block;color:var(--ink);text-decoration:none;border:1px solid var(--accent);padding:.6rem 1.2rem;font-size:.82rem;letter-spacing:.04em}
a:hover{background:var(--accent);color:var(--paper)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <div class="code">Error 404</div>
    <h1>This page does not exist</h1>
    <p>The link may be mistyped, or the page may have moved.</p>
    <a href="/">Back to the portfolio</a>
  </div>
</body>
</html>
